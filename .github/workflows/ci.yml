name: FinSight CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finsight
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: finsight_ci_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U finsight -d finsight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: finsight
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight_ci_password
      POSTGRES_PORT: 5433

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate reference data
        run: |
          python scripts/generate_reference_data.py

      - name: Generate financial data
        run: |
          python scripts/generate_financial_data.py

      - name: Create dirty financial data
        run: |
          python scripts/create_dirty_financial_data.py

      - name: Run local ETL
        run: |
          python -m finsight.pipeline

      - name: Run local ETL
        run: |
          python -m finsight.pipeline

      - name: Initialize database schema
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" \
          psql \
            -h localhost \
            -p "$POSTGRES_PORT" \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -f src/finsight/database/schema.sql

      - name: Load PostgreSQL data
        run: |
          python scripts/load_postgres.py

      - name: Create analytics views
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" \
          psql \
            -h localhost \
            -p "$POSTGRES_PORT" \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -f src/finsight/analytics/sql/financial_metrics.sql

          PGPASSWORD="$POSTGRES_PASSWORD" \
          psql \
            -h localhost \
            -p "$POSTGRES_PORT" \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -f src/finsight/analytics/sql/industry_benchmarks.sql

          PGPASSWORD="$POSTGRES_PASSWORD" \
          psql \
            -h localhost \
            -p "$POSTGRES_PORT" \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -f src/finsight/analytics/sql/company_rankings.sql

      - name: Run tests
        run: |
          pytest

      - name: Check formatting
        run: |
          git diff --check

      - name: Build Docker image
        run: |
          docker build -t finsight-api:ci .
