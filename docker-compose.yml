services:
  api:
    build:
      context: .
    container_name: finsight_api
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      OLLAMA_MODEL: "llama3:latest"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: finsight_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: "finsight"
      POSTGRES_USER: "finsight"
      POSTGRES_PASSWORD: "finsight_dev_password"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
