[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "0.1.0"
description = "Financial Data Engineering & Analytics Platform"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.35,<1",
    "pyspark>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx2>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
